# BoxForged — nginx site config
# Place at: /etc/nginx/sites-available/theboxforged.com
# Enable with: ln -s /etc/nginx/sites-available/theboxforged.com /etc/nginx/sites-enabled/
# Run: certbot --nginx -d theboxforged.com -d www.theboxforged.com

# ── Rate limiting ───────────────────────────────────────────────────────────────
# limit_req_zone must live in the http {} block of /etc/nginx/nginx.conf
# (or /etc/nginx/conf.d/rate-limits.conf if that file is included in http {}).
# Add this line there:
#
#   limit_req_zone $binary_remote_addr zone=uh_submit:10m rate=3r/m;
#
# 3 requests per minute per IP. 10m shared memory (~160k IPs). Burst of 5 handled below.

# ── HTTPS server ───────────────────────────────────────────────────────────────
server {
    server_name theboxforged.com www.theboxforged.com;

    root  /var/www/theboxforged.com;
    index index.html;

    access_log /var/log/nginx/theboxforged.com.access.log;
    error_log  /var/log/nginx/theboxforged.com.error.log;

    gzip            on;
    gzip_types      text/plain text/css text/javascript application/json image/svg+xml image/png;
    gzip_min_length 256;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin"  always;

    # ── Static assets — long cache ────────────────────────────────────────────
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Privacy page ──────────────────────────────────────────────────────────
    location /privacy {
        try_files $uri $uri/ /privacy/index.html;
    }

    # ── Submission proxy → n8n ────────────────────────────────────────────────
    # Proxies /api/submit to the n8n webhook, hiding the n8n URL from the public.
    # Change the proxy_pass host/port if n8n is not on localhost:5678.
    location /api/submit {
        limit_req zone=uh_submit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://127.0.0.1:5678/webhook/boxforged-submissions;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # ── Root and catch-all ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    # ssl_certificate and ssl_certificate_key will be added by Certbot
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name theboxforged.com www.theboxforged.com;
    return 301 https://$host$request_uri;
}

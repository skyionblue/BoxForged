# theunboxedheroes.com → boxforged.com redirect config
# Place at: /etc/nginx/sites-available/theunboxedheroes.com
# Enable with: ln -s /etc/nginx/sites-available/theunboxedheroes.com /etc/nginx/sites-enabled/
# Run: certbot --nginx -d theunboxedheroes.com -d www.theunboxedheroes.com

# ── HTTPS → permanent redirect to boxforged.com ────────────────────────────────
server {
    server_name theunboxedheroes.com www.theunboxedheroes.com;

    access_log /var/log/nginx/theunboxedheroes.com.access.log;
    error_log  /var/log/nginx/theunboxedheroes.com.error.log;

    # 301 permanent redirect — preserves path and query string.
    # e.g. theunboxedheroes.com/privacy → boxforged.com/privacy
    return 301 https://boxforged.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    # ssl_certificate and ssl_certificate_key will be added by Certbot
}

# ── HTTP → HTTPS → redirect (two-hop, cleaner than mixing HTTP + domain redirect)
server {
    listen 80;
    listen [::]:80;
    server_name theunboxedheroes.com www.theunboxedheroes.com;
    return 301 https://boxforged.com$request_uri;
}
